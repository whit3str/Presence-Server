name: Build Docker Images

on:
  push:
    branches: [ "main" ] # Déclenche l'action à chaque push sur la branche main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Si les Dockerfiles sont dans le projet, vous pouvez les build ainsi :
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend # À ajuster selon l'emplacement du code ou du sous-module
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/presence-backend:latest
          
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend # À ajuster selon l'emplacement
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/presence-frontend:latest
